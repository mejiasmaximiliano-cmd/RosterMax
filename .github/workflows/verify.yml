name: Verify isolated RosterMax
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  isolated-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run build:emulator
      - run: npm audit --omit=dev
      - run: npx firebase emulators:exec --only auth,firestore --project demo-rostermax "npm run test:all"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-test-evidence
          path: |
            playwright-report/
            test-results/
            audit/integral/
            audit/release/
            audit/welcome/
            audit/ux-polish/
